# MittelWerk Configuration
# ========================
# Development-safe defaults for the workshop baseline. No secrets belong in
# this file - see .env.example for the environment variables the app consumes.
#
# Python baseline: 3.12, verified against the 3.12.14 patch release, in sync
# with pyproject.toml requires-python, .github/workflows/ci.yml, and
# .devcontainer/devcontainer.json.

# Declarative workshop contract: Python stores UTC and the static dashboard
# presents Europe/Berlin. These are fixed cross-surface invariants, not runtime
# timezone switches.
timezone:
  application: "UTC"
  presentation: "Europe/Berlin"

server:
  host: "127.0.0.1"
  port: 8443
  log_level: "info"
  cors_origins: []
  cors_allow_credentials: false

risk:
  # Null is honest: the dashboard reports backlog-at-risk as unavailable
  # unless an explicit positive hours-variability assumption is supplied.
  hours_volatility: null

# Development-safe: local SQLite file, no external database server required.
database:
  url: "sqlite:///mittelwerk.db"
  echo: false

feed:
  # Supported modes: simulated, disabled, off, none. The reusable WebSocket
  # adapter is intentionally not wired into this offline workshop app.
  mode: "simulated"
  interval_ms: 100
  seed: 7

dashboard:
  # Aggregate totals are nominal simulator sums; no FX conversion is performed.
  currency: "EUR"

auth:
  key_ttl_seconds: 86400

logging:
  level: "INFO"
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
