name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      delivery_snapshot:
        description: "Retain this checked Linux environment as a snapshot (not release approval)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact interpreter patch baseline. Dependencies use bounded ranges rather
  # than a development lock file. Tagged deliveries retain their tested
  # snapshot separately; the checklist still requires a clean-room run.
  # Keep this compatible with requires-python and aligned with
  # the baseline documented in pyproject.toml and the devcontainer.
  PYTHON_VERSION: "3.12.14"

jobs:
  quality:
    name: Install, compile, and check quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Include source build tools in selected delivery environment
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_snapshot
        run: python -m pip install setuptools wheel

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Byte-compile source (syntax check)
        # -x skips any stray/scratch virtualenv or cache directories that
        # concurrent workstreams may leave behind under package folders.
        run: python -m compileall -q -x '(^|/)[^/]*venv[^/]*(/|$)|(^|/)__pycache__(/|$)' mittelwerk main.py scripts security_check.py tests

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run ruff (lint)
        run: python -m ruff check .

      - name: Run ruff (format check)
        run: python -m ruff format --check .

      - name: Run mypy (type check)
        run: python -m mypy mittelwerk main.py scripts

      - name: Run workshop doctor (environment preflight)
        run: python scripts/workshop_doctor.py --strict

      - name: Check generated participant journeys
        run: python scripts/workshop_journeys.py --check

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              flags=re.DOTALL | re.IGNORECASE,
          )
          if not scripts:
              raise SystemExit("dashboard contains no inline JavaScript")
          output = Path(os.environ["RUNNER_TEMP"]) / "mittelwerk-dashboard.js"
          output.write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/mittelwerk-dashboard.js"

      - name: Run bandit (security scan)
        run: python -m bandit -r mittelwerk main.py -ll

      - name: Run security_check.py (workshop vulnerability scan)
        run: python security_check.py

      # Manual repository workflows only: never package PR environments or publish
      # a release. Capture runs after every quality gate in this same environment.
      - name: Capture selected delivery environment
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_snapshot
        run: |
          python scripts/workshop_release.py capture --output dist/delivery-snapshot
          python scripts/workshop_release.py check --snapshot dist/delivery-snapshot

      - name: Retain selected environment snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: delivery-snapshot-${{ github.sha }}
          path: dist/delivery-snapshot/
          if-no-files-found: error
          retention-days: 90
